[project]
name = "optumapisdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "autoflake>=2.4.0",
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "requests-mock>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optumapisdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
